<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MANGA</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="home">
    <span id="commit-count" class="commit-count" aria-label="12번째 커밋">#12</span>
    <button id="choose" class="choose">폴더 선택 <span aria-hidden="true">↗</span></button>
    <input id="folder" type="file" webkitdirectory multiple hidden>
    <p id="notice" role="status"></p>
  </main>
  <main id="reader" class="reader" hidden>
    <header class="toolbar">
      <button id="back" class="icon-button" aria-label="초기 화면으로 돌아가기">&lt;</button>
      <div class="file-info"><span id="counter"></span><span class="divider">|</span><span id="filename"></span></div>
      <button id="settings" class="settings-button" aria-haspopup="dialog">설정 <span aria-hidden="true">⚙</span></button>
    </header>
    <div id="viewer" class="viewer">
      <section id="canvas" class="canvas" aria-label="만화 페이지"></section>
      <div id="page-bar" class="page-bar" aria-label="페이지 탐색" hidden>
        <span class="page-endpoint">1</span>
        <div class="page-track">
          <output id="page-bubble" for="page-range">1</output>
          <input id="page-range" type="range" min="1" max="1" value="1" step="1" aria-label="이동할 페이지">
        </div>
        <span id="page-total" class="page-endpoint">1</span>
      </div>
      <button id="previous" class="page-button previous" aria-label="이전 페이지">‹</button>
      <button id="next" class="page-button next" aria-label="다음 페이지">›</button>
    </div>
  </main>
  <dialog id="preferences" aria-labelledby="preferences-title">
    <div class="dialog-heading"><h1 id="preferences-title">설정</h1><button id="close-settings" class="icon-button" aria-label="설정 닫기">×</button></div>
    <label class="setting-row mode-row" for="scroll-mode"><span>넘기기</span><span class="toggle"><input id="scroll-mode" type="checkbox" role="switch" aria-label="스크롤 모드"><span class="track"></span></span><span>스크롤</span></label>
    <label class="setting-row" for="reverse"><span>역순</span><span class="toggle"><input id="reverse" type="checkbox" role="switch" aria-label="역순 On/Off"><span class="track"></span></span></label>
    <div class="shortcut">← → 페이지 이동 <span>ESC 닫기</span></div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
